<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>...</title>
</head>
<body onclick="interactuarFondo(event)">

  <img src="tree.gif" onclick="mostrarAviso(event)">

  <audio id="musicaFondo" loop preload="auto">
    <source src="man.mp3" type="audio/mpeg">
  </audio>

  <audio id="sonidoHuevo" preload="auto">
    <source src="egg.mp3" type="audio/mpeg">
  </audio>
  
  <audio id="sonidoTexto" preload="auto">
    <source src="text.mp3" type="audio/wav">
  </audio>
  
  <div id="cajaDialogo" class="dialogo-oculto" onclick="cerrarDialogo(event)">
    <p id="textoDialogo"></p>
  </div>

  <script>
    let audioIniciado = false;
    let contadorClics = 0;

    let intervaloTexto = null;
    let escribiendo = false;
    let textoCompletoActual = "";
    window.addEventListener('DOMContentLoaded', () => {
      reproducirAudio();
    });

    function reproducirBlipTexto() {
      const sfxTexto = document.getElementById('sonidoTexto');
      if (sfxTexto) {
        sfxTexto.currentTime = 0;
        sfxTexto.play().catch(() => {});
      }
    }

    function mostrarMensaje(mensaje) {
      const caja = document.getElementById('cajaDialogo');
      const textoElemento = document.getElementById('textoDialogo');
      
      if (intervaloTexto) clearInterval(intervaloTexto);
      
      caja.classList.remove('dialogo-oculto');
      textoElemento.innerText = "";
      textoCompletoActual = mensaje;
      escribiendo = true;

      let index = 0;
      
      intervaloTexto = setInterval(() => {
        if (index < mensaje.length) {
          const caracter = mensaje.charAt(index);
          textoElemento.innerText += caracter;

          if (caracter !== " ") {
            reproducirBlipTexto();
          }

          index++;
        } else {
          clearInterval(intervaloTexto);
          escribiendo = false;
        }
      }, 35); 
    }

    function cerrarDialogo(evento) {
      if (evento) evento.stopPropagation();
      
      const caja = document.getElementById('cajaDialogo');
      const textoElemento = document.getElementById('textoDialogo');

      if (escribiendo) {
        clearInterval(intervaloTexto);
        textoElemento.innerText = textoCompletoActual;
        escribiendo = false;
        return;
      }

      caja.classList.add('dialogo-oculto');
    }

    function reproducirAudio() {
      if (!audioIniciado) {
        const audio = document.getElementById('musicaFondo');
        audio.play().then(() => {
          audioIniciado = true;
        }).catch(error => {
          console.log("Autoplay bloqueado por el navegador, se iniciará con toque/clic.");
        });
        return true;
      }
      return false;
    }

    function interactuarFondo(evento) {
      const caja = document.getElementById('cajaDialogo');
      
      if (!caja.classList.contains('dialogo-oculto')) {
        cerrarDialogo(evento);
        return;
      }
      reproducirAudio();

      if (evento.target === document.body) {
        if (contadorClics >= 4) {
          mostrarMensaje("* (It is a tree.)");
        } else {
          mostrarMensaje("* (He is behind the tree.)");
        }
      }
    }
     
    function mostrarAviso(evento) {
      evento.stopPropagation();
      
      const caja = document.getElementById('cajaDialogo');
      if (!caja.classList.contains('dialogo-oculto')) {
        cerrarDialogo(evento);
        return;
      }

      reproducirAudio();

      contadorClics++;

      if (contadorClics === 1) {
        mostrarMensaje("* (Well, there is a man here.)");
      } else if (contadorClics === 2) {
        mostrarMensaje("* (He offered you something.)");
      } else if (contadorClics === 3) {
        const sfx = document.getElementById('sonidoHuevo');
        sfx.currentTime = 0;
        sfx.play().catch(e => console.log("Error en SFX:", e));

        mostrarMensaje("* (You received an Egg.)");
      } else {
        mostrarMensaje("* (Well, there is not a man here.)");
      }
    }

    document.addEventListener("visibilitychange", function() {
      const audio = document.getElementById('musicaFondo');
      if (document.hidden) {
        audio.pause();
      } else {
        if (audioIniciado) {
          audio.play();
        }
      }
    });
  </script>

</body>
</html>
